modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# 本模组的 mixin 只有一个：AE2 终端的「按 mod」排序在组内换成数值序（见 KeySortersMixin）。
# 文件名与 modId 同名只是跟隔壁几个姊妹模组保持一致；FML 仍需要这一段才会加载它。
[[mixins]]
config = "${mod_id}.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
logoFile="icon.png"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ae2"
type="required"
versionRange="[19.0.0,)"
ordering="NONE"
side="BOTH"

# JEI integration is optional, and the only thing this mod needs from it is the recipe-transfer listener
# hook: IRecipeTransferListener / IRecipeTransferContext / RecipeTransferResult appeared in 19.52.0, so that
# is the floor. The ceiling is the 19.x line itself: 20.0.0 targets another Minecraft version and replaces
# RecipeType with IRecipeType, which the disk-mark lookup still uses. A newer JEI than the floor is only
# what ExtendedAE Plus asks for, and that mod declares its own requirement - packs without it do not have to
# drag JEI up past 19.52.0. The compile baseline stays 19.56.0 (see gradle/libs.versions.toml).
[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[19.52.0,20.0.0)"
ordering="AFTER"
side="CLIENT"

# EMI integration is optional and client-side only: when JEI is not around the disk marks borrow their
# category names from EMI instead. 1.1.22 is the API this mod compiles against.
[[dependencies.${mod_id}]]
modId="emi"
type="optional"
versionRange="[1.1.22,)"
ordering="AFTER"
side="CLIENT"

# NEO ECO AE Extension is optional but covers both sides: its smart pattern bus accepts our disks, and its
# upload button is installed on our terminal. No version bound of our own: the auxiliary-pattern-store API
# only exists in our fork's builds, and a stock NEO ECO makes the reflection lookups fail and the integration
# stand down (with a log line) rather than block the load.
[[dependencies.${mod_id}]]
modId="neoecoae"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"

# Jade is optional and has real code on our side (integration/jade), so the relationship is declared instead of
# being left to the dev runtime. 15.10.6 is the API this mod compiles against. CLIENT because that plugin is a
# display integration Jade discovers on its own; a server that happens to run Jade is not checked (AE2 declares
# it BOTH, the AE2 add-ons around us use CLIENT).
[[dependencies.${mod_id}]]
modId="jade"
type="optional"
versionRange="[15.10.6,)"
ordering="AFTER"
side="CLIENT"

# The AE2 <-> JEI bridge is a mod of its own; without it JEI has no AE2 recipe categories for our marks to read
# names from. We do not reference its classes, so no version bound of our own.
[[dependencies.${mod_id}]]
modId="ae2jeiintegration"
type="optional"
versionRange="*"
ordering="AFTER"
side="CLIENT"

# AE2 Crystal Science is optional, and the relationship runs the other way: it is the one calling into our
# PatternDiskApi (its own metadata does not declare us), so this entry only says the two are meant to ship
# together - no version bound of our own, same reasoning ExtendedAE Plus uses for `extendedae`. BEFORE keeps
# us loaded first, so a consumer that touches our API during its setup does not race our own construction.
[[dependencies.${mod_id}]]
modId="ae2cs"
type="optional"
versionRange="*"
ordering="BEFORE"
side="BOTH"
