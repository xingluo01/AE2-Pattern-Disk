modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# 本模组的 mixin 只有一个：AE2 终端的「按 mod」排序在组内换成数值序（见 KeySortersMixin）。
# 文件名与 modId 同名只是跟隔壁几个姊妹模组保持一致；FML 仍需要这一段才会加载它。
[[mixins]]
config = "${mod_id}.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
logoFile="icon.png"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ae2"
type="required"
versionRange="[19.0.0,)"
ordering="NONE"
side="BOTH"

# JEI integration is optional, and the only thing this mod needs from it is the recipe-transfer listener
# hook: IRecipeTransferListener / IRecipeTransferContext / RecipeTransferResult appeared in 19.52.0, so that
# is the floor. The ceiling is the 19.x line itself: 20.0.0 targets another Minecraft version and replaces
# RecipeType with IRecipeType, which the disk-mark lookup still uses. A newer JEI than the floor is only
# what ExtendedAE Plus asks for, and that mod declares its own requirement - packs without it do not have to
# drag JEI up past 19.52.0. The compile baseline stays 19.56.0 (see gradle/libs.versions.toml).
[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[19.52.0,20.0.0)"
ordering="AFTER"
side="CLIENT"

# EMI integration is optional and client-side only: when JEI is not around the disk marks borrow their
# category names from EMI instead. 1.1.22 is the API this mod compiles against.
[[dependencies.${mod_id}]]
modId="emi"
type="optional"
versionRange="[1.1.22,)"
ordering="AFTER"
side="CLIENT"

# NEO ECO AE Extension is optional, and the relationship now runs both ways: it compiles against this mod's
# PatternDiskApi and registers its own disk holders and terminal views, while this mod registers a parallel
# intake with it and installs an upload action on this mod's terminal. That contract arrived in 21.2.1 - the
# first release to name this mod at all (its changelog gives AE2 Pattern Disk 0.7.1 as a floor). An older
# build does not merely lack a feature: it cannot see this mod, so the integration would have nothing to
# stand down from. Hence a declared floor instead of per-feature probes - a build below it is refused at load
# time with a plain message, rather than failing later inside the other mod's constructor.
#
# A beta of 21.2.1 or later is refused by this range: Maven ranks a release above its own pre-releases, so
# `[21.2.1,)` excludes `21.2.1-beta3`. Widen it to `[21.2.1-beta2,)` while testing against a beta build.
[[dependencies.${mod_id}]]
modId="neoecoae"
type="optional"
versionRange="[21.2.1,)"
ordering="AFTER"
side="BOTH"

# OmniSequence: Transfinite (molecularmanipulator) is optional and has real code on our side
# (integration/omnisequence): the batch assembler registers a batch adapter and a post-accounting output
# adapter with its two registries. No version bound of our own - versionRange="*" - for the same reason as
# ae2jeiintegration below: both registrations are additive lookups that degrade to nothing on an older build,
# and the compile-time surface we use (OmniBatchCraftingProvider and the two adapter registries) is what we
# build against. Declared so a pack that ships it runs our adapters in the dev runtime too.
[[dependencies.${mod_id}]]
modId="molecularmanipulator"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"

# Jade is optional and has real code on our side (integration/jade), so the relationship is declared instead of
# being left to the dev runtime. 15.10.6 is the API this mod compiles against. CLIENT because that plugin is a
# display integration Jade discovers on its own; a server that happens to run Jade is not checked (AE2 declares
# it BOTH, the AE2 add-ons around us use CLIENT).
[[dependencies.${mod_id}]]
modId="jade"
type="optional"
versionRange="[15.10.6,)"
ordering="AFTER"
side="CLIENT"

# The AE2 <-> JEI bridge is a mod of its own; without it JEI has no AE2 recipe categories for our marks to read
# names from. We do not reference its classes, so no version bound of our own.
[[dependencies.${mod_id}]]
modId="ae2jeiintegration"
type="optional"
versionRange="*"
ordering="AFTER"
side="CLIENT"

# AE2 Crystal Science is optional, and we do not compile against it: the self-assembling pattern disk
# provider registers only while that mod is present, so a pack without it simply has no such device. The
# relationship is otherwise by mod id alone - its overload card is looked up in the item registry at runtime
# (see AecsSoftDep), never referenced as a class - so no version bound of our own is needed, same reasoning
# ExtendedAE Plus uses for `extendedae`. BEFORE keeps us loaded first, so our setup-time presence probe does
# not race its construction.
[[dependencies.${mod_id}]]
modId="ae2cs"
type="optional"
versionRange="*"
ordering="BEFORE"
side="BOTH"

# GuideME is the guidebook library AE2's help hooks are built on: this mod overrides
# AEBaseScreen#getHelpTopic() - whose return type is guideme.PageAnchor - on its four screens. AE2 itself
# declares guideme as a required dependency, so no pack can reach us without it; this entry only makes the
# relationship visible instead of leaving it implicit in an overridden method signature.
[[dependencies.${mod_id}]]
modId="guideme"
type="required"
versionRange="*"
ordering="NONE"
side="BOTH"

# AE2 Wireless Terminals (AE2WTLib) is required: the two wireless terminals are built on its terminal API - the
# item base class, the menu host, and the AddTerminalEvent registration all come from its api artifact, which
# ships with the mod itself (the screen style our wireless screens include lives there too).
# AFTER keeps us behind it, so its terminal list is populated before we add to it.
[[dependencies.${mod_id}]]
modId="ae2wtlib"
type="required"
versionRange="[19.5.0,)"
ordering="AFTER"
side="BOTH"

# ExtendedAE Plus is optional: its terminal-upload contract is one this mod implements (a screen subclass and
# a menu subclass), and both are created through reflection so their classes only load when the contract is
# there. No version bound of our own - the published 1.6.2 lacks the interface, the 1.21.1 branch has it, and
# the integration stands down when the lookup fails. AFTER matches the other optional entries: they are the
# ones we reach into.
[[dependencies.${mod_id}]]
modId="extendedae_plus"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"

# Polymorph ("多态合成") is optional: when a set of ingredients matches more than one crafting recipe it lets
# the player pick which result to make, and our encoding terminal asks it for that pick instead of taking the
# first match. Its API is reached through a small bridge class that is only loaded once the mod is known to be
# present, so a pack without it keeps the plain "first match wins" behaviour and never loads its types.
# AFTER matches the other optional entries: it is the one we reach into.
[[dependencies.${mod_id}]]
modId="polymorph"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"
