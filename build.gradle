plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'dev.vfyjxf.modaccessor' version '1.2.1'
    alias libs.plugins.modDevGradle
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }

    client {
        compileClasspath += main.output
        runtimeClasspath += main.output + main.runtimeClasspath
    }

    test {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    clientRuntimeClasspath.extendsFrom clientLocalRuntime
    testRuntimeClasspath.extendsFrom testLocalRuntime
}

modAccessor {
    createTransformConfiguration(configurations.compileOnly)
    createTransformConfiguration(configurations.clientCompileOnly)
    accessTransformerFiles = project.files('src/main/resources/META-INF/mods_accessor.cfg')
}

neoForge {
    version = libs.versions.neoForge.get()

    parchment {
        minecraftVersion = libs.versions.minecraft.get()
        mappingsVersion = libs.versions.parchment.get()
    }

    accessTransformers {
        // Minecraft/NeoForge ATs.
        var mcFile = project.file('src/main/resources/META-INF/accesstransformer.cfg')
        from(mcFile)
        publish(mcFile)
        // ModAccessor ATs: NeoForge also applies these to mod classes at runtime.
        var modFile = project.file('src/main/resources/META-INF/mods_accessor.cfg')
        from(modFile)
    }
    // ModAccessor ATs target AE2 (mod) classes; ModDevGradle cannot validate them against the MC
    // class table, so validation is disabled.
    validateAccessTransformers = false

    addModdingDependenciesTo(sourceSets.test)
    addModdingDependenciesTo(sourceSets.client)

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.client)
            sourceSet(sourceSets.test)
        }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            logLevel = org.slf4j.event.Level.INFO
        }

        client {
            client()
            sourceSet = sourceSets.client
            ideName = "Client"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // ModDevMCP: make the game-instances registry land under this project so the
            // model can discover the local HTTP service baseUrl.
            systemProperty 'moddevmcp.project.root', project.projectDir.absolutePath
        }

        server {
            server()
            ideName = "Server"
            programArguments.addAll '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.test
            ideName = "Game Tests"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            sourceSet = sourceSets.main
            ideName = "Data Generation"
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            neo_version_range       : neo_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
sourceSets.main.resources.srcDir generateModMetadata

tasks.named('processResources', ProcessResources) {
    dependsOn generateModMetadata
}

dependencies {
    compileOnly(libs.jetbrains.annotations)

    // AE2 full mod jar. ModAccessor transforms it (accessCompileOnly) to widen private fields;
    // the plain compileOnly provides the normal compile classpath.
    compileOnly "org.appliedenergistics:appliedenergistics2:${libs.versions.ae2.get()}"
    accessCompileOnly "org.appliedenergistics:appliedenergistics2:${libs.versions.ae2.get()}"
    // GuideME (used by AE2 for its guide; compile against provided API)
    compileOnly(libs.guideme)

    // Client source set: needs AE2 client classes (AEBaseScreen, StyleManager).
    clientCompileOnly "org.appliedenergistics:appliedenergistics2:${libs.versions.ae2.get()}"

    // Runtime: AE2 and GuideME must be present in the dev/game environment (mods.toml requires ae2).
    // Using the user-provided curse maven coordinate for AE2 1.21.1.
    localRuntime "curse.maven:applied-energistics-2-223794:7027323"
    localRuntime "maven.modrinth:guideme:21.1.15"

    // AECS (AE2-Crystal-Science) dev build: local jar for pattern-disk compatibility integration.
    localRuntime files("E:/GitHub/AE2-Crystal-Science/build/libs/ae2cs-1.21.1-neoforge-1.1.0.jar")

    // Runtime environment mods (1.21.1 NeoForge) from Modrinth.
    // Modern UI
    localRuntime "maven.modrinth:modern-ui:3.13.0.1"
    // Jade
    localRuntime "maven.modrinth:jade:15.10.6+neoforge"
    // Integrated Dynamics family (curse maven, as provided) + Cyclops Core dependency
    localRuntime "curse.maven:integrated-dynamics-236307:8679254"
    localRuntime "curse.maven:cyclops-core-232758:8527422"
    localRuntime "curse.maven:integrated-tunnels-251389:8649383"
    localRuntime "curse.maven:common-capabilities-247007:8469575"
    // Mekanism family
    localRuntime "maven.modrinth:mekanism:10.7.19.85"
    localRuntime "maven.modrinth:mekanism-generators:10.7.19.85"
    localRuntime "maven.modrinth:mekanism-tools:10.7.19.85"
    // Embeddium (Sodium equivalent for NeoForge)
    localRuntime "maven.modrinth:embeddium:1.0.15+mc1.21.1"
    // Refined Storage: required at runtime because Cyclops Core's GameTest mixin scans classes
    // that reference RS API (ClassNotFoundException otherwise).
    localRuntime "maven.modrinth:refined-storage:2.0.9"

    // ModDevMCP: dev-only mod providing UI inspection, screenshots, and interaction automation
    // via a local loopback HTTP service (used for moddevskill visual verification).
    localRuntime "dev.vfyjxf:moddevmcp:0.1.6"

    // Recipe viewers - EMI for runtime testing
    localRuntime(libs.emi)

    // ModDevMCP: local HTTP service (loopback) the model uses to drive/inspect the running
    // game. Resolved to the local ModDevMCP :Mod via includeBuild substitution in settings.gradle
    // (Java 21 / NeoForge 21.1 build); transitive=false as the only dep (Reflect) is jarJar'd.
    implementation("dev.vfyjxf:moddevmcp:0.3") {
        transitive = false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases/"
    }
    maven { // JEI mirror, AE2
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    exclusiveContent { // terraformers - EMI
        forRepository { maven { url = "https://maven.terraformersmc.com/releases/" } }
        filter { includeGroup("dev.emi") }
    }
    exclusiveContent { // Modrinth Maven
        forRepository { maven { url = "https://api.modrinth.com/maven" } }
        filter { includeGroup("maven.modrinth") }
    }
    exclusiveContent { // Curseforge Maven
        forRepository { maven { url = "https://cursemaven.com" } }
        filter { includeGroup("curse.maven") }
    }
}
