plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'dev.vfyjxf.modaccessor' version '1.2.1'
    // Modrinth 发布。日常构建不受影响，只有带 MODRINTH_TOKEN 的环境（CI 的 release job）才跑 modrinth 任务。
    id 'com.modrinth.minotaur' version '2.9.0'
    alias libs.plugins.modDevGradle
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// NeoForge 1.21.1 ships Java 21 to end users.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }

    // Client is intentionally kept as a separate source set so server/common code
    // never accidentally depends on client-only classes.
    client {
        compileClasspath += main.output
        runtimeClasspath += main.output + main.runtimeClasspath
    }

    test {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.output + main.runtimeClasspath
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    clientRuntimeClasspath.extendsFrom clientLocalRuntime
    testRuntimeClasspath.extendsFrom testLocalRuntime
}

modAccessor {
    createTransformConfiguration(configurations.compileOnly)
    createTransformConfiguration(configurations.clientCompileOnly)
    accessTransformerFiles = project.files('src/main/resources/META-INF/mods_accessor.cfg')
}

neoForge {
    version = libs.versions.neoForge.get()

    parchment {
        minecraftVersion = libs.versions.minecraft.get()
        mappingsVersion = libs.versions.parchment.get()
    }

    accessTransformers {
        def mcFile = project.file('src/main/resources/META-INF/accesstransformer.cfg')
        from(mcFile)
        publish(mcFile)

        def modFile = project.file('src/main/resources/META-INF/mods_accessor.cfg')
        from(modFile)
    }

    // ModAccessor targets AE2 classes which are not part of the Minecraft class table.
    validateAccessTransformers = false

    addModdingDependenciesTo(sourceSets.test)
    addModdingDependenciesTo(sourceSets.client)

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.client)
            sourceSet(sourceSets.test)
        }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            logLevel = org.slf4j.event.Level.INFO
        }

        client {
            client()
            sourceSet = sourceSets.client
            ideName = 'Client'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'moddevmcp.project.root', project.projectDir.absolutePath
        }

        server {
            server()
            ideName = 'Server'
            programArguments.addAll '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.test
            ideName = 'Game Tests'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            sourceSet = sourceSets.main
            ideName = 'Data Generation'
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }
    }
}

// The default Java component only contains sourceSets.main. This project deliberately
// keeps client code in a separate source set, so merge it into the distributable JAR.
// The explicit dependency also makes the ordering clear for remapJar/build.
tasks.named('jar', Jar) {
    dependsOn sourceSets.client.classesTaskName
    from sourceSets.client.output
    // LGPL-3.0 requires the license text to travel with the distribution.
    from('LICENSE') { into 'META-INF' }
}

tasks.matching { it.name == 'remapJar' }.configureEach {
    dependsOn sourceSets.client.classesTaskName
}

// Generate mods.toml from the template before resources are processed.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version       : minecraft_version,
        minecraft_version_range : minecraft_version_range,
        neo_version             : neo_version,
        neo_version_range       : neo_version_range,
        loader_version_range    : loader_version_range,
        mod_id                  : mod_id,
        mod_name                : mod_name,
        mod_license             : mod_license,
        mod_version             : mod_version,
        mod_authors             : mod_authors,
        mod_description         : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata

tasks.named('processResources', ProcessResources) {
    dependsOn generateModMetadata
}

dependencies {
    compileOnly(libs.jetbrains.annotations)

    // AE2 / GuideME are provided by the game/modpack and only needed for compilation.
    compileOnly(libs.ae2)
    accessCompileOnly(libs.ae2)
    compileOnly(libs.guideme)

    // EMI API for recipe-transfer integration (runtime is provided by the modpack).
    clientCompileOnly(libs.emi)

    // JEI API for the recipe-transfer integration. Compile-only: JEI stays an optional runtime mod and
    // only the @JeiPlugin entry point touches its classes (mirrors how EMI is wired above).
    clientCompileOnly(libs.jei)

    // NEO ECO AE Extension: dev reference for the pattern-disk integration (upload-to-ECO button,
    // disk-aware storage, autocrafting from disk-held patterns).
    //
    // 2026-10-08：改用公开发布件。21.2.1（CF file 9095600，release）是 CF 渠道上第一个带本模组所需接口的
    // 发布版——它的更新日志提到「样板磁盘最低版本为 AE2 Pattern Disk 0.7.1」，而运行期实测三项集成均已挂上
    // （上传按钮、并行接收注册、磁盘侧存储）。此前三个引用都指向 libs/neoecoae-21.2.1.jar（从上游 main 自建
    // 的同一版本号构建件），换成发布坐标后那份本地件不再需要。
    //
    // 21.2.1 同时也是外部施加的下限：Neo ECO Prototype（下面的运行期依赖）声明 neoecoae [21.2.1-beta2,)。
    // mods.toml 也把同一条写成依赖下限（`[21.2.1,)`），所以已无「旧版 ECO 降级」这条路径——集成里对应的
    // 探测代码已删。注：Maven 排序里 release 高于 pre-release，因此 `21.2.1-beta3` 这类构建会被该下限拒；
    // 临时拿 beta 联调要把 mods.toml 那行放宽。
    compileOnly 'curse.maven:neo-eco-ae-extension-1460639:9095600'
    clientCompileOnly 'curse.maven:neo-eco-ae-extension-1460639:9095600'

    // Client source set: explicit client-side API access.
    clientCompileOnly(libs.ae2)
    clientCompileOnly(libs.guideme)

    // Runtime-only development mods.
    localRuntime 'curse.maven:applied-energistics-2-223794:7027323'
    localRuntime 'maven.modrinth:guideme:21.1.15'

    // AECS development integration: the jar sits in libs/, so the dev runtime - and the
    // dev client built from it - loads it the same way. Drop a fresh build of that mod's jar in as
    // libs/ae2cs-<version>.jar; libs/*.jar is not tracked in git.
    //
    // Runtime only, on purpose. The self-assembling pattern disk provider is gated on AECS being present and
    // reaches it by mod id alone (AecsSoftDep looks the overload card up in the item registry, and the
    // registration check is ModList), so nothing here needs a compileOnly line: with no AECS installed this
    // mod still works exactly as before, minus that one device. The jar below is what lets the dev runtime
    // actually exercise it.
    localRuntime files('libs/ae2cs-1.21.1-1.3.0.jar')

    // AE2WTLib: the two wireless terminals this mod adds build on it (item base, host, screens, terminal
    // registration), so the dev runtime needs both the mod and its api.
    // 19.5.1（而不是 19.5.0）：Applied Enhancements 只支持 ae2wtlib 19.5.1 及以上，低于它就拒绝加载。
    localRuntime 'de.mari_023:ae2wtlib:19.5.1'
    localRuntime 'de.mari_023:ae2wtlib_api:19.5.1'

    // 无线终端（本模组两个终端的无线版）编译期靠 ae2wtlib_api：
    // 物品继承 ItemWT、宿主继承 WTMenuHost、屏幕实现 IUniversalTerminalCapable、登记走 AddTerminalEvent，
    // 全在这份 api 里。main 与 client 两个源集都要看得到。
    compileOnly 'de.mari_023:ae2wtlib_api:19.5.1'
    clientCompileOnly 'de.mari_023:ae2wtlib_api:19.5.1'
    // Polymorph（多态合成）：客户端要继承它的 widget API（PlayerRecipesWidget），
    // 所以必须进 client 源集的编译类路径——项目是双源集，main 侧的 compileOnly 看不到这里。
    clientCompileOnly 'maven.modrinth:polymorph:9yWvrF5o'

    // EAE (ExtendedAE) + AAE (AdvancedAE) dev environment: reference mods for GUI/feature parity work.
    // 1.21.1/NeoForge/AE2 19.2.x compatible (EAE 1.21-2.2.35, AAE 1.6.11-1.21.1).
    localRuntime 'curse.maven:ex-pattern-provider-892005:8511901'
    localRuntime 'curse.maven:advancedae-1084104:7849217'

    // Applied Flux (AppFlux) dev reference: it registers a extra upgrade slot on AE2's own pattern
    // providers and interfaces, and that slot is what both of this mod's provider forms have to show and
    // register a card limit for. Without it in the runtime the integration cannot be exercised at all.
    // Its three required dependencies (AE2, Glodium, GuideME) are already in this block or above it.
    localRuntime 'maven.modrinth:appflux:4x40hq9D'

    // 雕凿编码面板要在编译期读 Rechiseled 的配方表（ChiselingRecipeManager），所以这里要 compileOnly；
    // 运行期在不在场由 mod 壳自己决定。Rechiseled 是软依赖：它缺席时那个面板不注册，终端行为与从前一样
    // （见 integration/rechiseledae 下的探针）。照本仓习惯，集成的类要隔开隔离，免得缺席时 NoClassDefFoundError
    // （同 AppFlux / NEO ECO 的做法）。取 CurseForge 的 file 8875899 而不是 Modrinth 的 1.2.5，原因见下方那段。
    compileOnly 'curse.maven:rechiseled-558998:8875899'
    clientCompileOnly 'curse.maven:rechiseled-558998:8875899'
    // 雕凿样板要用 RechiseledAE2 自己的物品与数据组件（EncodedChiselingPattern），所以它也进编译面。
    compileOnly 'maven.modrinth:rechiseled-applied-energistics-2:1.0.1-neoforge-mc1.21.1'

    // Rechiseled + Rechiseled: Applied Energistics dev reference. The latter adds a third kind of encoded
    // pattern - `rechiseledae:chiseling_pattern`, a plain IPatternDetails that a molecular assembler runs -
    // and that item is exactly what this mod's new "chiseling" disk type exists to hold. Without it in the
    // runtime the type can never be made to appear, so there is nothing to exercise. Rechiseled pulls in
    // SuperMartijn642's Core Lib and Config Lib, plus Fusion on the client only.
    //
    // KNOWN CONFLICT (seen in game 2026-10-02 on the Modrinth 1.2.5 build): Rechiseled ships
    // `jei.RecipeLayoutUserInputHandlerMixin`, which injects into JEI's RecipeLayoutWithButtons and there
    // references `mezz.jei.gui.input.UserInput` - a class JEI moved out of that package by 19.56. So with
    // JEI 19.56 installed, opening a JEI recipe page (RecipesGui.mouseClicked -> createUserInputHandler)
    // fails mixin transformation and crashes the client. Nothing to do with this mod, but it does block
    // in-game verification of the chiseling type: you cannot open JEI at all. Dropping JEI back to ~19.27
    // collides with the EAE+ requirement documented further down, so it is not a free switch; hence the
    // CurseForge file above, which is a newer build than Modrinth's 1.2.5 and may or may not carry the fix.
    localRuntime 'curse.maven:rechiseled-558998:8875899'
    localRuntime 'maven.modrinth:rechiseled-applied-energistics-2:1.0.1-neoforge-mc1.21.1'
    localRuntime 'curse.maven:supermartijn642s-core-lib-454372:7521894'
    localRuntime 'curse.maven:supermartijn642s-config-lib-438332:5546996'
    clientLocalRuntime 'maven.modrinth:fusion-connected-textures:1.3.2b-neoforge-mc1.21.1'

    // ExtendedAE Plus (EAE+) dev reference. Its "upload pattern to a provider" button is the feature the
    // pattern disk provider has to serve, so it belongs in the dev runtime to exercise that path.
    //
    // 已发布的 1.6.2（Modrinth o8U8Ekro，2026-08-28）是对着旧版 JEI 编的：它的 jei.BookmarkOverlayMixin 调用
    // mezz.jei.gui.input.handlers.CombinedInputHandler，而 JEI 19.56 把这个类挪到了 mezz.jei.common.input.handlers，
    // 于是 JEI 一启动就 ClassNotFoundException，客户端进世界即崩。EAE+ 侧已修（本地提交 389c8e44 / 85a50ea5，
    // mods.toml 声明 jei 为可选依赖 [19.56.0,)）但尚未发版，所以这里优先用放到 libs/ 的本地构建产物
    // （与上面的 AECS、NEO ECO 同法，libs/*.jar 不入库）。换别的构建用 -PeaePlusJar=<jar 路径>；
    // 没有本地件时回退到 Modrinth 发布件，但那个版本与 JEI 19.56 不兼容，进入世界会崩溃。
    def eaePlusJar = providers.gradleProperty('eaePlusJar')
            .map { file(it) }
            .getOrElse(file('libs/extendedae_plus-1.6.2-dev.jar'))
    if (eaePlusJar.exists()) {
        localRuntime files(eaePlusJar)
    } else {
        logger.warn("EAE+ 本地构建产物不存在（{}），回退到 Modrinth 发布件 1.6.2 —— 该版本与 JEI 19.56 不兼容，" +
                "进入世界会崩；修复办法见本行上方注释。", eaePlusJar)
        localRuntime 'maven.modrinth:extendedae-plus:o8U8Ekro'
    }

    // EAE+ 的终端兼容层接口（IPatternUploadMenu / IPatternUploadTerminal）目前只存在于它的 1.21.1 分支，
    // Modrinth 最新发布版（1.6.2，2026-08-28）还没有这两个类，所以编译期也用 libs/ 里这份构建产物。
    // EAE+ 发版后把这里与上面的 localRuntime 一起换成 maven.modrinth 坐标；release.yml 里对应的
    // 下载步骤（EAEPLUS_JAR_URL）也要一并删掉。
    compileOnly files(eaePlusJar)
    clientCompileOnly files(eaePlusJar)
    // Curios and Kotlin for Forge are runtime references of EAE+'s own integrations.
    localRuntime 'curse.maven:curios-309927:6529130'
    localRuntime 'curse.maven:kotlin-for-forge-351264:7471280'

    // Glodium: shared AE2-ecosystem UI library required at runtime by both EAE and AAE.
    localRuntime 'io.github.glodblock:Glodium:1.21-2.2-neoforge'
    // GeckoLib: mandatory runtime dependency of AdvancedAE (requires >= 4.8.2 for 1.21.1).
    // Use the modrinth version id (not the bare version number, which collides across loaders
    // and resolves to the Fabric jar).
    localRuntime 'maven.modrinth:geckolib:gFmrC8Ru'

    // Runtime environment mods used for integration testing.
    localRuntime 'maven.modrinth:modern-ui:3.13.0.1'
    localRuntime 'maven.modrinth:jade:15.10.6+neoforge'
    // The provider classes compile against Jade, and the plugin's client registration is client-side API, so the
    // dependency has to sit on the main compile classpath rather than only in the runtime block above.
    compileOnly 'maven.modrinth:jade:15.10.6+neoforge'

    // Polymorph（多态合成）：可选前置。只借它的公开 API，不捆绑任何代码/资源。
    // 未装时本模组必须完全不受影响，所以引用它的类都要先过加载守卫。
    compileOnly 'maven.modrinth:polymorph:9yWvrF5o'
    localRuntime 'maven.modrinth:mekanism:10.7.19.85'
    localRuntime 'maven.modrinth:mekanism-generators:10.7.19.85'
    localRuntime 'maven.modrinth:mekanism-tools:10.7.19.85'
    localRuntime 'maven.modrinth:embeddium:1.0.15+mc1.21.1'
    // AE2 Omni Cells: mixed-type storage cells (items+fluids in one cell, up to 256m tiers) used to
    // build storage test setups the vanilla cell tiers cannot cover. Dev-only (localRuntime).
    // Modrinth version id k444ySGT = AE Omni Cells 1.1.6 for 1.21.1 neoforge.
    localRuntime 'maven.modrinth:ae2-omni-cells:k444ySGT'

    // AE2 Lightning Tech ("闪电科技", modId ae2lt) + its required core library Thunderbolt Core, plus
    // AE2LT Packaged Pattern Provider ("闪电科技封包", modId ae2ltpp) - an addon of the former that routes
    // AE2/AE2LT autocrafting into other mods' special crafting systems. Dev-only (localRuntime): this mod
    // neither imports nor bundles any of their classes, they are here to test that we coexist.
    //
    // Version choice: Thunderbolt Core 2.0.1 declares AE2 19.2.17-19.2.x, which covers both the AE2 we
    // compile against and the latest 1.21.1 release (19.2.18). All three shipped 2026-10-01.
    //
    // CAUTION: Thunderbolt Core replaces/auges AE2's autocrafting internals, so this is a deep-coupling
    // mod family (same risk shape as the Rechiseled JEI mixin that broke JEI pages - note above). After
    // any AE2 version bump, smoke test: AE2 terminal -> autocrafting panels -> a JEI recipe page.
    // Note the AE2 lower bound is exactly 19.2.17 for ae2lt/thunderbolt, so dropping the runtime AE2
    // below that (or touching the AE2 localRuntime coordinate) trips the same FML dependency check.
    localRuntime 'maven.modrinth:ae2-lightning-tech:2.1.1'
    localRuntime 'maven.modrinth:thunderbolt-core:2.0.1'
    localRuntime 'maven.modrinth:ae2lt-packaged-pattern-provider:1.2.1'

    // Polymorph（多态合成）：开发环境装上用于集成测试，不进发布依赖——
    // 正式运行时它是可选前置（未装时本模组需完全不受影响）。
    // 服务端（main）与客户端（client）两侧都要它：菜单走配方查询，屏幕走 widget。
    localRuntime 'maven.modrinth:polymorph:9yWvrF5o'
    clientLocalRuntime 'maven.modrinth:polymorph:9yWvrF5o'

    // ECO 关联附属（NEO ECO AE Extension 官方联动清单里、与本模组功能面有交叉的那些）：只进开发
    // 环境，不参与发布依赖。下面这批的名单来自 ECO 源码树自己的 compat/ 与 integration/ 目录、以及
    // 它 21.2.0 的 changelog 依赖表；这里挑的是「会去抢同一批 AE2 派发/合成路径」的高优先几个，
    // 那是最该实测的共存组合。
    // 2026-10-08：ECO 换到 21.2.1 的发布件（此前用的是上游 main 同版本号的自建件），按它的
    // neoforge.mods.toml 重核过这批区间——只有 ldlib2 的硬地板从 2.2.39.a 升到 [2.2.40,)，因此下面那条
    // ldlib 坐标同步升到 2.2.40；其余三方声明的区间未变。
    //   OmniSequence Transfinite（molecularmanipulator）：Omni Batch Provider API，已成 Mek
    //     Energistics 等附属的集成点；ECO 要求 2.0.5+。
    //   Applied Enhancements：long 大数量合成 + 可选 MAX_FAST 规划器 + 样板终端的重复输出查找，
    //     正面压本模组的大订单吞吐与样板管理面。它自述「默认不接管 MAX_FAST 以免与其他规划器竞争」
    //     ——这句话本身就是四方（它 / ECO / Mek Energistics（已摘掉，见下）/ 本模组）抢同一改动面的证据。
    //   Mek Energistics：**2026-10-02 试装后摘掉**（原因见下方那段），不在这里。
    //   Data Energistics：ECO 的 integration 与 compat 里都有；它另需 configuration 与 ldlib2。
    //   AE2 Utility：JEI 里直接「样板编码 + 上传」，与本模组的样板上传面重叠。
    //   a-useless-mod：万象合金炉的大数量目标 API，ECO 声明改进了它的大数量合成与批量派发。
    //
    // 前两条是 2026-09-30 停用、2026-10-02 恢复的：当时它们缺前置 appliedenhancements [1.0.9,)，
    // 而 CF 构件不带依赖元数据、前置 jar 从未进入运行时，FML 在 pre-loading 直接中止启动。
    // 现在本体与前置都列在这里，且已按各自 jar 内的 neoforge.mods.toml 逐条核过区间：
    //   omnisequence 2.0.6 需 extendedae [1.21-2.2.32-neoforge,) / ldlib2 [2.2.18,) / appliedenhancements [1.0.9,)；
    //     **2.0.7 把 appliedenhancements 的地板抬到 [1.1.0,)**（本模组采纳 2.0.7 是为了批量契约的适配器
    //     注册表，见上方那条），所以下面这一对必须同批升：只升 omnisequence 会在预加载阶段被 FML 拦住
    //     （实测：`Mod molecularmanipulator requires appliedenhancements 1.1.0 or above`）。
    //   data-energistics 需 configuration [3.1.1,4) / ldlib2 [2.2.38.a,)；
    //   ae2utility 需 JEI（已在环境里）。
    // 未恢复的是「闪电科技重生」那一支（AE2 Lightning Tech Reborn 等）：它与上方已装的「闪电科技」
    // **同为 modId ae2lt / thunderbolt**，只能整线择一，不能并存。
    // OmniSequence: the batch contract's adapter registry (what our issue #4 asked for) arrived in 2.0.7, so
    // this is the first version we can compile against - the machine itself stays free of its types and the
    // integration class is only loaded when `molecularmanipulator` is present, but the adapter does implement
    // its interface at compile time.
    compileOnly 'curse.maven:omnisequence-transfinite-1624558:9043224'
    localRuntime 'curse.maven:omnisequence-transfinite-1624558:9043224'    // 2.0.7
    localRuntime 'curse.maven:applied-enhancements-1665696:9043227'        // 1.1.0（随 omnisequence 2.0.7 的地板一起升）
    // 试装后又摘掉的：**Mek Energistics（mekenergistics）**。它与 ECO 双向集成（ECO 侧有
    // compat/mekenergistics），但代价太大：每次启动会刷约 335 条 "Unknown registry key … item:
    // mekenergistics:me_*" 的 ERROR —— 它为 Mekanism 系可选集成镜像的 me_* 机器方块只在对应 mod
    // 在场时才注册，而 loot 表是无条件随包发行的。补 Mekanism:More Machine 让这批降到 262、但对方
    // 自己又添 80 条；补 Mekanism Extras 只解决 36 条、自己还多两条 mixin 警告；两条都是净亏，要
    // 清零得把整个 Mekanism 系可选集装齐。它当时还需一个前置 Applied Mekanistics（appmek）：
    // Modrinth 的版本元数据里没写这条依赖（jar 内的 toml 写的是 required [1.6.3,)），缺它 FML 会
    // 直接中止启动；随它一并摘掉。它要的版本也麻烦：CF 3.0.8 与 Modrinth 2.0.2 版本号体系不同步，
    // 而它至今仍留下一组指向 data_energistics 旧包 ...util 的 mixin（实测 DE 3.1.3 及以后那类在
    // ...menu.patternprovider，旧包 ...util 已无此类），即它的 DE 桥本来就接不上。
    localRuntime 'curse.maven:data-energistics-1565514:8841396'            // 3.2.2
    // 用版本 id 而不是版本号：Modrinth 上 configuration 的 3.1.1 有 fabric / neoforge / forge 三个
    // 同名版本，写 3.1.1 会被解析到 forge 那份——FML 直接跳过该 jar（"is for Minecraft Forge or an
    // older version of NeoForge"），连带 data_energistics 的必需前置落空、整个 mod 加载失败。这一条与
    // 客户端/服务端无关，是加载器格式问题（同一坐标在不同时刻解析到过不同 loader 的同名件，所以
    // “上次 runServer 跑过”不能当排除依据）。
    // 6Mztfq1u 才是 neoforge 那份（META-INF/neoforge.mods.toml，loaderVersion [2,)）。
    localRuntime 'maven.modrinth:configuration:6Mztfq1u'                   // data-energistics 的前置
    localRuntime 'maven.modrinth:ae2utility:1.8.0'
    localRuntime 'maven.modrinth:a-useless-mod:1.21.1-2.4.5.4'

    // 整理模组（Inventory Profiles Next + 它的库 libIPN）：开发环境装上用于验证「整理」不会把终端里
    // 非玩家槽（升级槽、样板输出槽）的物品移到光标。两个都是 mod，都只能进开发环境。
    localRuntime 'curse.maven:inventory-profiles-next-495267:7810574'
    localRuntime 'curse.maven:libipn-679177:7810552'
    // 四个终端屏上打了 @IPNPlayerSideOnly（整理模组给模组作者留的官方注解），编译需要它的注解类；运行时
    // 由上面那条 localRuntime 提供。用得到的只有客户端的屏，所以走 clientCompileOnly。compileOnly 不进
    // 产物，没装整理模组时这些注解只是类文件里的元数据，没人读也就没有影响。
    clientCompileOnly 'curse.maven:inventory-profiles-next-495267:7810574'
    // Neo ECO AE Extension: separates crafting/storage/computation into multiblock structures whose
    // computation cluster supplies a huge crafting-dispatch budget (thousands of parallel ops) through
    // its own CraftingService mixin. Dev-only; used to test large-order throughput and the
    // Pattern-Disk <-> FD Smart Pattern Bus integration.
    // Runtime uses the same dev jar as compile: runClient is how the integration is exercised, and a
    // published artifact may lag the version this mod was developed against.
    localRuntime 'curse.maven:neo-eco-ae-extension-1460639:9095600'
    // Neo ECO Prototype: the unofficial L1 add-on for NEO ECO (drives, energy cells, bulk matrices,
    // interfaces and a pattern provider below ECO's L4 tier). Dev-only like every other optional
    // compatibility target - it is not a published dependency of this mod, and nothing in src/ names
    // its types: the cell management terminal reaches the storage side through ECO's own classes, and
    // this add-on's L1 drive is an ECO storage host like any other. It is loaded so that enumeration
    // can be exercised against it.
    // Hard gate: its mods.toml declares neoecoae [21.2.1-beta2,), which is the same floor this mod now
    // declares (and 21.2.1 is the CurseForge release the build above resolves to).
    localRuntime 'curse.maven:neo-eco-prototype-1695260:9098136'   // 1.3.1（2026-10-08；旧件 9069127 是 1.3.0-beta1）
    // MEGA Cells: ECO 的联动清单要求 4.11.0+（大宗盘与小型大宗矩阵），Neo ECO Prototype 也把它列为可选前置。
    // 只进开发环境。Modrinth 把该项目放在 id jjuIRIVr 下（slug 也是 megacells），RPG4EriK = 4.11.0 for
    // 1.21.1 neoforge；用 id + version id 而非版本号，免得跨 loader 解析到别的构建。
    localRuntime 'maven.modrinth:jjuIRIVr:RPG4EriK'
    // ECO More Cell: ECO 的附属（更多存储单元）。坐标由用户给出，只进开发环境；它是可选的，缺席时本模组不受影响。
    localRuntime 'curse.maven:eco-more-cell-1720697:9026477'
    // LDLib: mandatory runtime dependency of Neo ECO AE Extension (its GUI library). Pin the exact
    // version Neo ECO itself depends on (2.2.40) instead of a nearby release, so Gradle cannot
    // downgrade the transitive requirement.
    // Modrinth version id A8dTTrXo = ldlib2 1.21.1-2.2.40-neoforge.
    localRuntime 'maven.modrinth:ldlib:A8dTTrXo'
    localRuntime 'dev.vfyjxf:moddevmcp:0.1.6'
    // 开发运行期配方查看器默认 JEI：玩家侧的 JEI 兼容就在 runClient 里手动验证。需要回到 EMI 口径
    // 核对时用 -Pemi 启动（EMI 仍保留编译期兼容，见上面的 clientCompileOnly(libs.emi)）。
    //
    // JEI 走官方 maven，不进 libs/：libs/ 那份策略只给没有公共 maven 的本地 mod（AECS /
    // ModDevMCP / EAE+）。版本以 libs.versions.toml 的 jei 钉位为准，且必须与 EAE+ 仓库引用的那个版本
    // （19.56.0.438，见其 build.gradle 的 compileOnly/runtimeOnly）一致——EAE+ 的终端兼容层就是对着这个
    // 版本编的，错开就会重现上次「进世界即崩」。
    if (project.hasProperty('emi')) {
        localRuntime(libs.emi)
    } else {
        localRuntime(libs.jei.runtime)
        // AE2 的 JEI 集成是独立模组（AE2 本体不带），它的元数据又把 jei 标成 required：只能跟着 JEI 分支
        // 走——放进 EMI 口径会让客户端因缺 JEI 直接加载失败。没有它，JEI 里根本不会出现与本项目（及
        // AE2 终端）相关的配方转移入口，本项目的 JEI 兼容层也就无从验证。与 EAE+ 开发环境同一份坐标。
        // 1.2.1（fileId 7727898）而不是 1.2.0：data_energistics 把 ae2jeiintegration 标成 optional
        // [1.2.1,)，而 FML 对**已安装**的可选依赖同样做版本检查。装 1.2.0 时崩溃报告里报的是 DE 自己
        // 的消息：「Mod data_energistics only supports ae2jeiintegration 1.2.1 or above / Currently,
        // ae2jeiintegration is 1.2.0」。1.2.1 要求 AE2 [19.0.22-beta,) 与 JEI [19.19.3,)，两边都满足。
        // 我们反射用的两个类及其 getConverter(IIngredientType) / getStackFromIngredient(Object) 在
        // 1.2.0→1.2.1 之间签名未变（javap 比对一致）。
        localRuntime 'curse.maven:ae2-jei-integration-1074338:7727898'
    }

    // ModDevMCP 0.3 没有发布到任何公共 maven（Central / NeoForged / modmaven / BlameJared 都没有）。
    // 原先靠 settings.gradle 的 composite-build 替换或 mavenLocal 解析，CI 上两者都没有，
    // 所以改成显式指向 libs/ 下的 jar：本地从 mavenLocal 复制，CI 由 release workflow 按
    // 仓库变量 MODDEVMCP_JAR_URL 下载。
    // Compile-only: the 0.3 jar declares a javafml language level NeoForge 21.1 does not provide, so
    // loading it into the dev runtime fails the entire mod load ("broken mod state") and with it every
    // event, including menu registration. Nothing in src/ references it; the dev-runtime tool comes from
    // the dev.vfyjxf:moddevmcp dependency above, which settings.gradle substitutes with the local source
    // build when that checkout is present.
    compileOnly files('libs/moddevmcp-0.3.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases/'
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
    }
    // JEI (official Maven for the API artifacts).
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    exclusiveContent {
        forRepository {
            maven { url = 'https://maven.terraformersmc.com/releases/' }
        }
        filter { includeGroup 'dev.emi' }
    }
    exclusiveContent {
        forRepository {
            maven { url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository {
            maven { url = 'https://cursemaven.com' }
        }
        filter { includeGroup 'curse.maven' }
    }
}

// ---- Modrinth 发布 ---------------------------------------------------------
// 由 CI 驱动：推 tag 后 release workflow 注入 MODRINTH_TOKEN / MODRINTH_PROJECT_ID /
// MODRINTH_CHANGELOG，再执行 `./gradlew modrinth`。本地没有这些变量也能正常构建（占位值），
// 只是不要执行 modrinth 任务。首次上线前可临时打开 debugMode 干跑，确认待上传内容无误。
modrinth {
    token = System.getenv('MODRINTH_TOKEN')
    projectId = System.getenv('MODRINTH_PROJECT_ID') ?: 'unset'
    versionNumber = mod_version
    versionName = "AE2 Pattern Disk ${mod_version}"
    versionType = 'release'
    uploadFile = tasks.named('jar')
    gameVersions = ['1.21.1']
    loaders = ['neoforge']
    changelog = System.getenv('MODRINTH_CHANGELOG') ?: 'See the GitHub release notes.'
    // minotaur 不会从 mod 元数据推断依赖，必须显式声明，否则 CI 发布的版本会丢掉这条；
    // 手工发布时是单独 PATCH 上去的。
    dependencies {
        required.project 'ae2'
    }
    // debugMode = true
}

