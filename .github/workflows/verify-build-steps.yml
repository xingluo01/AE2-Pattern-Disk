# 临时验证 workflow：只跑构建前置三段，用来验证升级后的 action 能否正常工作。
# 验证完即删（不进发布链路）。手动触发，不发布任何版本。
name: Verify build steps (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Gradle smoke check
        run: |
          # gradle.properties 里的 org.gradle.java.home 是 Windows 本地路径，CI 上用 JAVA_HOME 覆盖
          # （release.yml 的构建步骤同样这么覆盖）
          ./gradlew --version
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" tasks --no-daemon -q | head -20
