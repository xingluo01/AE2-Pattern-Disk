name: Release

# 推 tag（如 v0.2.1）即发布：构建 → Modrinth → CurseForge → GitHub Release。
#
# 更新日志优先从仓库里的 CHANGELOG.md 取当前版本的段落，取不到才退回按提交主题拼接。
#
# 需要在仓库里预先配置（Settings → Secrets and variables → Actions）：
#   Secrets   MODRINTH_TOKEN         Modrinth PAT。发版至少要 VERSION_CREATE（上传新版本）；
#                                   标准更新流程再勾 VERSION_WRITE（改已发布版本的元数据/文件）与
#                                   PROJECT_WRITE（改项目元数据）。发版本身不需要它，但 sync-project-pages.yml
#                                   同步项目描述时要（本项目没用 minotaur 的 syncBodyFrom，所以只需一处）。
#                                   删除类、支付类、用户认证类、组织/收藏/通知类都不用勾。
#                                   scope 名以 VERSION_CREATE 为准（minotaur README 写作
#                                   CREATE_VERSION 是它的笔误）。
#             CURSEFORGE_TOKEN       https://www.curseforge.com/account/api-tokens 生成
#   Variables MODRINTH_PROJECT_ID    Modrinth 项目 id 或 slug
#             CURSEFORGE_PROJECT_ID  CurseForge 数字项目 id（不是 slug）
#             NEOECOAE_JAR_URL       libs/neoecoae-21.2.0-beta5.jar 的下载地址（见下方说明）
#             MODDEVMCP_JAR_URL     libs/moddevmcp-0.3.jar 的下载地址（同为本地专属依赖，见下方说明）
#             EAEPLUS_JAR_URL       libs/extendedae_plus-1.6.2-dev.jar 的下载地址（缺它 fetch 步骤会硬失败，见下方说明）
#
# 两个平台都要求项目先存在：Modrinth 项目要已创建；CurseForge 项目必须人工在站点创建（自动化只能传文件，
# 建不了项目），且首个文件要过人工审核才对玩家可见。
#
# 重跑同一个 tag：Modrinth 会因版本号已存在而失败，CurseForge 不去重、会再传一份。发布中断后优先改
# 版本号重发，不要直接重跑（否则 CF 会多出一份重复文件）。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # v7 相对 v4 的破坏性变更（凭据持久化改为独立文件、禁止在 pull_request_target/workflow_run
        # 下检出 fork PR）对“tag push”工作流无影响；fetch-depth 语义未变。
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 需要完整历史来生成 changelog

      - name: Resolve version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        # v6 移除了 legacy Adopt 发行版、改了部分输入名；本处用到的 distribution/java-version 不受影响。
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        # v6 起官方缓存逻辑改为专有组件（升级即视为接受其 ToU），cache-provider: basic
        # 指回 MIT 的 @actions/cache 实现，避开许可变更。
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # build.gradle 把 libs/neoecoae-<version>.jar 当作 compileOnly 依赖，而该 jar 不入 git（第三方
      # 构建产物，见 README）。把 fork（xingluo01/NeoECOAEExtension，分支 feature/pattern-disk-v21.1.2）
      # 构建出的 jar 传到一个 release asset / 可直链，再把地址填进仓库变量 NEOECOAE_JAR_URL。
      # 那个分支现已把上游 v21.1.2 合并进来（21.2.0-beta5 基线），版号与官方发布同名，换 jar 时
      # 别把官方构建传上去——这里要的是带辅助存储 API 的 fork 构建。
      # 第二个 jar（ModDevMCP 0.3）同样未发布到公共 maven，由变量 MODDEVMCP_JAR_URL 提供，
      # 对应 build.gradle 里的 compileOnly files('libs/moddevmcp-0.3.jar')（那份 0.3 jar 只上编译类路径，
      # 开发运行期的工具来自 dev.vfyjxf:moddevmcp，src 里不引用它）。
      # 第三个 jar（ExtendedAE Plus 的本地构建，含其终端兼容层接口 IPatternUploadMenu /
      # IPatternUploadTerminal；Modrinth 最新发布版 1.6.2 还没有这两个类）由变量 EAEPLUS_JAR_URL 提供，
      # 对应 build.gradle 里的 compileOnly / clientCompileOnly files('libs/extendedae_plus-<版本>-dev.jar')。
      # 两者现均托管在 release `deps-v1`（tag 不以 v 开头，不会触发本 workflow）。
      # 版本号变化时这里的文件名要跟 build.gradle 一起改。
      - name: Fetch local-only dependency jars
        env:
          JAR_URL: ${{ vars.NEOECOAE_JAR_URL }}
          MCP_JAR_URL: ${{ vars.MODDEVMCP_JAR_URL }}
          EAEPLUS_JAR_URL: ${{ vars.EAEPLUS_JAR_URL }}
        run: |
          set -euo pipefail
          if [ -z "${JAR_URL}" ]; then
            echo "::error title=缺少仓库变量::NEOECOAE_JAR_URL 未设置，compileOnly 依赖无法解析，构建必然失败。"
            exit 1
          fi
          if [ -z "${MCP_JAR_URL}" ]; then
            echo "::error title=缺少仓库变量::MODDEVMCP_JAR_URL 未设置，compileClasspath 上的 moddevmcp 无法解析，构建必然失败。"
            exit 1
          fi
          if [ -z "${EAEPLUS_JAR_URL}" ]; then
            echo "::error title=缺少仓库变量::EAEPLUS_JAR_URL 未设置，EAE+ 终端兼容层接口缺失，编译必然失败。"
            exit 1
          fi
          mkdir -p libs
          curl -fL --retry 3 --retry-delay 5 -o libs/neoecoae-21.2.0-beta5.jar "$JAR_URL"
          curl -fL --retry 3 --retry-delay 5 -o libs/moddevmcp-0.3.jar "$MCP_JAR_URL"
          curl -fL --retry 3 --retry-delay 5 -o libs/extendedae_plus-1.6.2-dev.jar "$EAEPLUS_JAR_URL"
          # 校验下载内容：Gradle 对 files() 里不存在的文件是静默跳过，靠这里把“下错文件”挡在构建前。
          # 若日后替换 deps-v1 上的同名 jar，必须同步更新下面三条哈希。
          echo "07a6eeddf533bf14f40842ca825ce9a576169058e29bd4ebebc14cd5c55c6921  libs/neoecoae-21.2.0-beta5.jar" | sha256sum -c -
          echo "ce22ff7266a8462e1ae7062d17df1fdbdd06bdf29e5501c2f6d6ded6daf33789  libs/moddevmcp-0.3.jar" | sha256sum -c -
          echo "f789723bde98d709885501184f5335ae06a84a9ad6ad5a4c51366eabb3a2fcd1  libs/extendedae_plus-1.6.2-dev.jar" | sha256sum -c -
          ls -l libs

      # gradle.properties 里的 org.gradle.java.home=C:/Java/jdk-21 与 jvmargs 里的 Windows-ROOT 信任库
      # 都只在 Windows 本地成立（Linux runner 上没有 Windows-ROOT 这种 keystore 类型）。前者用
      # -Dorg.gradle.java.home 覆盖，后者整体覆盖 org.gradle.jvmargs。
      # 命令行属性优先级高于 gradle.properties，见 Gradle 文档 Build Environment。
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build \
            -Pmod_version=${{ steps.ver.outputs.version }} \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -Dorg.gradle.jvmargs="-Xmx3G -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djavax.net.ssl.trustStoreType=JKS"

      - name: Collect changelog
        id: changelog
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # 优先用仓库里的 CHANGELOG.md：那是按玩家视角整理过的说明，比拼接 commit 主题可读。
          # 取 "## [<版本>]" 到下一个 "## [" 之间的内容（三级标题 ### 不会误终止）。取不到就
          # 退回到按提交主题拼接，保证任何情况下都有内容可用。
          BODY=""
          SOURCE="none"
          if [ -f CHANGELOG.md ]; then
            # 用 index() 判头而不是正则：CI 的 awk 是 mawk，\[ 在 POSIX ERE 里属未定义写法。
            BODY=$(awk -v ver="$VERSION" '
              index($0, "## [") == 1 {
                if (found) exit
                if (index($0, "[" ver "]") > 0) { found = 1; next }
              }
              found { print }
            ' CHANGELOG.md | sed -e '/./,$!d')
            if [ -n "$BODY" ]; then SOURCE="CHANGELOG.md"; fi
          fi
          if [ -z "$BODY" ]; then
            SOURCE="commit log"
            PREVIOUS=$(git describe --tags --match 'v[0-9]*' --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            if [ -n "$PREVIOUS" ]; then
              BODY=$(git log --no-merges --pretty=format:'- %s (%h)' "${PREVIOUS}..${GITHUB_REF_NAME}")
            else
              BODY=$(git log --no-merges --pretty=format:'- %s (%h)' "${GITHUB_REF_NAME}")
            fi
          fi
          # 回退是静默的，打一行出来，事后能从 CI 日志看出发布说明是哪来的。
          echo "changelog source: $SOURCE (${#BODY} chars)"
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_CHANGELOG: ${{ steps.changelog.outputs.body }}
        run: >
          ./gradlew modrinth
          --no-configuration-cache
          -Pmod_version=${{ steps.ver.outputs.version }}
          -Dorg.gradle.java.home="$JAVA_HOME"
          -Dorg.gradle.jvmargs="-Xmx3G -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djavax.net.ssl.trustStoreType=JKS"

      - name: Publish to CurseForge
        uses: itsmeow/curseforge-upload@v3.1.2
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project_id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          game_endpoint: minecraft
          file_path: build/libs/ae2_pattern_disk-${{ steps.ver.outputs.version }}.jar
          display_name: AE2 Pattern Disk ${{ steps.ver.outputs.version }} [NeoForge 1.21.1]
          release_type: release
          changelog: ${{ steps.changelog.outputs.body }}
          changelog_type: markdown
          # CF 的 gameVersions 必须包含「环境组」（Client/Server），否则会报
          #   You must select at least one version from the environment group of versions
          # 该 Action 只会把名称/slug 查表转成 id，既不会自动补环境组，匹配不到还会静默丢弃，
          # 所以这里直接写传统接口 GET /api/game/versions 的数字 id：
          #   1.21.1=11779  NeoForge=10150  Client=9638  Server=9639
          # 注意 Eternal API（api.curseforge.com）的编号是另一套（1.21.1 = 89/12735），
          # 用错会报 invalid dependency。
          game_versions: '11779,10150,9638,9639'
          # CF 侧的依赖关系：AE2 在 CF 的 slug（该 Action 只发 slug；CF 文档里数字 id 属可选
          # 的 projectID 字段，写进 slug 位可能解析不到）。不在 CI 里声明的话，玩家在 CF 页看不到“需要 AE2”。
          relations: 'applied-energistics-2:requiredDependency'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          # 直接用上面收集的 changelog，与 Modrinth/CF 口径一致。
          # 不给 generate_release_notes：GitHub 生成 notes 以“上一个 tag / 上一次 release”为基线，
          # 会拿托管构建依赖的 deps-v1 当基线，导致说明只剩一条；若两者同时给，body 会被
          # “前置”到自动 notes 之上（不是覆盖）。
          # v3 的运行时是 Node 24（v2 的 Node 20 已被 GitHub 弃用）。
          body: ${{ steps.changelog.outputs.body }}
          files: build/libs/ae2_pattern_disk-${{ steps.ver.outputs.version }}.jar
          # 产物路径写错时硬失败，而不是静默生成一个没有附件的 release
          fail_on_unmatched_files: true
